<style id="css">@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Saira:wght@200;300;400;500&display=swap');
/* layout: one narrow editorial column, phone first; cream ground, navy type, blue only for today's price */
:root { --bg: #F4F0E9; --paper: #FFFFFF; --ink: #081E3D; --muted: #5F6E86; --soft: #8A93A3; --rule: #DDD3C4; --blue: #0A4992; --band: #E2E9F2;
  --ar: 'Cairo', 'Segoe UI', Tahoma, sans-serif; --num: 'Saira', 'Cairo', sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { direction: rtl; background: var(--bg); color: var(--ink); font-family: var(--ar); font-size: 16px; line-height: 1.7; margin: 0; }
main { max-width: 620px; margin: 0 auto; padding-block: 18px 64px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p { margin: 0; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 16px; }
.wm { color: var(--ink); display: flex; align-items: center; gap: 12px; }
.wm svg { height: 44px; width: auto; display: block; }
.wm span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.upd { font-size: 13px; color: var(--blue); font-weight: 600; background: var(--band); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.hero { position: relative; border-radius: 4px; overflow: hidden; }
.hero img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.hero p { position: absolute; right: 18px; left: 18px; bottom: 16px; color: #FFFFFF; font-size: 21px; font-weight: 600; line-height: 1.45; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
.intro { font-size: 16px; color: var(--muted); margin-top: 14px; }
section { margin-top: 38px; }
section > h2 { font-size: 26px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
section > h2 span { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 4px; }
.curph { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; font-size: 15px; }
.curph b { background: var(--ink); color: #FFFFFF; font-weight: 600; padding: 3px 12px 5px; border-radius: 3px; }
.cards { display: grid; gap: 14px; margin-top: 16px; }
.card { background: var(--paper); border-radius: 4px; display: grid; grid-template-columns: 1fr 112px; gap: 14px; padding: 16px; align-items: center; }
.card img { width: 112px; height: 140px; object-fit: contain; display: block; background: var(--bg); border-radius: 3px; }
.card h3 { font-size: 20px; font-weight: 700; line-height: 1.35; }
.card .meta { font-size: 14px; color: var(--muted); line-height: 1.55; }
.card .lab { font-size: 12px; color: var(--blue); font-weight: 600; margin-top: 10px; }
.card .pr { font-family: var(--num); font-size: 30px; font-weight: 300; color: var(--blue); line-height: 1.15; }
.card .pr small { font-family: var(--ar); font-size: 14px; margin-right: 4px; }
.card .nx { font-size: 13px; color: var(--soft); }
.card .units { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px 3px; border: 1px solid var(--rule); color: var(--muted); }
.chip.on { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.chip.done { text-decoration: line-through; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 4px; background: var(--ink); color: #FFFFFF;
       font-family: var(--ar); font-size: 16px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn:focus-visible, .ebtn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.card .btn { min-height: 40px; font-size: 14px; margin-top: 12px; padding: 0 14px; }
.tw { overflow-x: auto; margin-top: 16px; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; min-width: 520px; }

.cur { background: var(--ink); color: #FFFFFF; }

.inc { margin-top: 10px; font-size: 14px; color: var(--muted); }

<script type="text/plain" id="main">(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var RAW = { css: $('#css').textContent, assets: $('#assets').textContent, main: $('#main').textContent, title: $('title').textContent };
  var A = JSON.parse(RAW.assets);
  var S = JSON.parse($('#state').textContent);
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
  var MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function dateAr(iso) { var p = String(iso || '').split('-'); if (p.length < 3) return esc(iso); return (+p[2]) + ' ' + MONTHS[(+p[1]) - 1] + ' ' + p[0]; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function wa(msg) { return 'https://wa.me/' + S.contact.wa + '?text=' + encodeURIComponent(msg); }
  function model(id) { for (var i = 0; i < S.models.length; i++) if (S.models[i].id === id) return S.models[i]; return null; }
  function unitFirst(code) { var u = S.units[code]; return (u && u.first) || 0; }
  var STATUS = { now: 'متاحة الآن', soon: 'تُطرح لاحقاً', done: 'اكتملت' };

  function view() {
    var ph = S.phases[S.phase], nxt = S.phases[S.phase + 1];
    var h = '';
    h += '<header class="top"><div class="wm">' + A.wordmark + '<span>' + esc(S.tag) + '<br>' + esc(S.place) + '</span></div><div class="upd">آخر تحديث · ' + dateAr(S.updated) + '</div></header>';
    h += '<div class="hero"><img src="' + A.hero + '" alt="واجهة مبنى السلوى في حي الربوة"><p>' + esc(S.kind === 'inv' ? 'لا تشتري شقة… اشتري دخل شهري' : 'في الأعلى… حيث يليق بك السكن') + '</p></div>';
    h += '<p class="intro">هذه الصفحة تتحدّث باستمرار: سعر اليوم، والمتاح، وتقدّم البناء. افتحها متى شئت لترى آخر حال السلوى.</p>';
    // today
    h += '<section id="today"><h2>سعر اليوم<span>السعر يتحدد بمرحلة البناء، ويرتفع مع كل مرحلة حتى التسليم</span></h2>';
    h += '<div class="curph"><b>' + esc(ph.name) + '</b>' + (ph.until ? '<span>ساري حتى ' + esc(ph.until) + '</span>' : '<span>' + esc(ph.period) + '</span>') + '</div><div class="cards">';
    S.models.forEach(function (m) {
      var units = Object.keys(S.units).filter(function (c) { return S.units[c].model === m.id; }).sort();
      var price = m.prices[S.phase], np = m.prices[S.phase + 1];
      h += '<article class="card"><div><h3>' + esc(m.title) + '</h3><p class="meta">' + esc(m.side) + ' · <span class="n">' + esc(m.area) + '</span> م²' + esc(m.areaNote || '') + '<br>' + esc(m.rooms) + '</p>';
      h += '<p class="lab">سعر اليوم</p><p class="pr">' + fmt(price) + '<small>ريال</small></p>';
      if (nxt && np) h += '<p class="nx">في ' + esc(nxt.name) + ': <span class="n">' + fmt(np) + '</span> ريال</p>';
      h += '<div class="units">' + units.map(function (c) { var st = S.units[c].status; return '<span class="chip ' + (st === 'now' ? 'on' : st === 'done' ? 'done' : '') + '"><span class="n">' + c + '</span> · ' + STATUS[st] + '</span>'; }).join('') + '</div>';
      h += '<a class="btn" href="' + wa(S.waMsg.replace(/\)$/, '') + ' — ' + m.title + ')') + '" target="_blank" rel="noopener">سجّل اهتمامك</a></div>';
      h += '<img src="' + A['plan_' + m.img] + '" alt="مخطط ' + esc(m.title) + '"></article>';
    });
    h += '</div></section>';
    // price table
    h += '<section id="prices"><h2>الأسعار حسب مراحل البناء<span>' + (S.kind === 'inv' ? 'الأسعار بالريال للوحدة دون التأثيث' : 'الأسعار بالريال') + ' · مواعيد المراحل اللاحقة تقديرية وترتبط بتقدّم البناء</span></h2><div class="tw"><table><thead><tr><th></th>';
    S.phases.forEach(function (p, j) { h += '<th class="' + (j === S.phase ? 'cur' : '') + '">' + (j === S.phase ? '<span class="tag">سعر اليوم</span><br>' : '') + esc(p.name) + '<span>' + esc(p.period) + '</span></th>'; });
    h += '</tr></thead><tbody>';
    var rows = [];
    if (S.kind === 'res') { Object.keys(S.units).sort().forEach(function (c) { var m = model(S.units[c].model); rows.push({ lab: c, sub: m.side, prices: m.prices, first: unitFirst(c) }); }); }
    else { S.models.forEach(function (m) { rows.push({ lab: m.title, sub: m.side, prices: m.prices, first: 0 }); }); }
    rows.forEach(function (r) {
      h += '<tr><td class="rl">' + esc(r.lab) + '<br><span style="font-weight:400;color:var(--soft);font-size:12px">' + esc(r.sub) + '</span></td>';
      r.prices.forEach(function (v, j) { h += j < r.first ? '<td class="off">لم تُطرح</td>' : '<td class="' + (j === S.phase ? 'cur' : '') + '">' + fmt(v) + '</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    var svs = S.models.map(function (m) { return { t: m.side, v: m.prices[m.prices.length - 1] - m.prices[S.phase] }; }).filter(function (x) { return x.v > 0; });
    var same = svs.every(function (x) { return x.v === (svs[0] || {}).v; });
    if (svs.length) h += '<p class="save">من يبدأ اليوم يوفّر ' + (same ? '<span class="n">' + fmt(svs[0].v) + '</span> ريال' :
      svs.map(function (x) { return '<span class="n">' + fmt(x.v) + '</span> ريال في ' + esc(x.t); }).join('، و')) + ' مقارنةً بسعر التسليم.</p>';
    if (S.income) h += '<p class="inc">الإيراد الإيجاري الإجمالي المتوقع: <span class="n">' + esc(S.income) + '</span> ريال سنوياً · مؤثثة · على أساس 10 أشهر إشغال · باقة التأثيث الفندقي بسعر مستقل · تفاصيل التشغيل في العقد.</p>';
    h += '</section>';
    // availability
    h += '<section id="avail"><h2>المتاح الآن<span>الوحدات الداكنة متاحة الآن بسعر اليوم</span></h2><div class="grid" style="--cols:' + S.cols.length + '">';
    h += '<div class="ghead"><div></div>' + S.cols.map(function (c) { return '<div>' + esc(c) + '</div>'; }).join('') + '</div>';
    S.floors.forEach(function (f) {
      h += '<div class="grow"><div class="fl">' + esc(f.name) + '</div>';
      f.units.forEach(function (c) {
        var u = S.units[c], m = model(u.model), st = u.status;
        var label = st === 'now' ? fmt(m.prices[S.phase]) : (st === 'done' ? 'اكتملت' : (unitFirst(c) > S.phase ? esc(S.phases[unitFirst(c)].name) : 'تُطرح لاحقاً'));
        var inner = '<b>' + c + '</b><span class="' + (st === 'now' ? 'n' : '') + '">' + label + '</span>';
        h += st === 'now' ? '<a class="cell now" href="' + wa(S.waMsg.replace(/\)$/, '') + ' — الوحدة ' + c + ')') + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="cell ' + st + '">' + inner + '</div>';
      });
      h += '</div>';
    });
    h += '</div></section>';
    // progress
    h += '<section id="progress"><h2>تقدّم البناء<span>التسليم المتوقع في الربع الثاني من 2028</span></h2><div class="prog">';
    S.progress.forEach(function (g) { h += '<div class="st ' + g.state + '"><div class="dot">' + (g.state === 'done' ? '✓' : '') + '</div><div><b>' + esc(g.name) + '</b><span>' + esc(g.note) + '</span></div></div>'; });
    h += '</div></section>';
    // news
    h += '<section id="news"><h2>آخر الأخبار</h2><div class="log">';
    S.log.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (l) { h += '<div><time datetime="' + esc(l.date) + '">' + dateAr(l.date) + '</time><p>' + esc(l.text) + '</p></div>'; });
    h += '</div></section>';
    // contact
    h += '<section id="contact"><h2>سجّل اهتمامك<span>التسجيل مجاني ولا يُلزمك بشيء، ويتواصل معك فريق السامي العقارية بكل التفاصيل</span></h2><div class="contact">';
    h += '<a class="btn" href="' + wa(S.waMsg) + '" target="_blank" rel="noopener">سجّل اهتمامك عبر واتساب</a>';
    h += '<div class="phone"><b>' + esc(S.contact.tel) + '</b><button type="button" id="copy">نسخ الرقم</button></div>';
    h += '<a class="btn ghost" href="' + esc(S.contact.map) + '" target="_blank" rel="noopener">الموقع على خرائط Google</a></div></section>';
    h += '<footer class="foot">' + A.logo + '<p>حيث يلتقي السمو بالعمران</p><small>الصور تصورات ثلاثية الأبعاد لأغراض توضيحية، وقد تختلف بعض التفاصيل عند التنفيذ. الأسعار لا تشمل ضريبة التصرفات العقارية.</small></footer>';
    return h;
  }

  function render() {
    $('#app').innerHTML = view();
    var cp = $('#copy');
    if (cp) cp.addEventListener('click', function () {
      var t = S.contact.tel, done = function () { cp.textContent = 'تم النسخ'; setTimeout(function () { cp.textContent = 'نسخ الرقم'; }, 1600); };
      try { navigator.clipboard.writeText(t).then(done, function () { selectPhone(); }); } catch (e) { selectPhone(); }
    });
  }
  function selectPhone() { var b = $('.phone b'); if (!b) return; var r = document.createRange(); r.selectNodeContents(b); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }


  render();
})();</script>
<script>(function(){function run(){var s=document.createElement('script');s.text=document.getElementById('main').textContent;document.body.appendChild(s)}fetch('../data/inv.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(j&&j.units&&j.models)document.getElementById('state').textContent=JSON.stringify(j)},function(){}).then(run,run)})();</script>
</body>
</html>
